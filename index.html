<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pick a version</title>
<style>
  :root{--ground:#E4E2D9;--ink:#1B1B18}
  html{background:var(--ground);color:var(--ink);font:18px/1.5 system-ui,sans-serif}
  body{margin:0;padding:32px 20px;max-width:520px}
  h1{font-size:22px;margin:0 0 6px}
  p{margin:0 0 20px;opacity:.75}
  a{display:block;padding:16px 4px;border-top:1px solid var(--ink);color:inherit;text-decoration:none;min-height:44px}
  a:last-child{border-bottom:1px solid var(--ink)}
  a:hover,a:focus-visible{background:var(--ink);color:var(--ground)}
  small{display:block;opacity:.7}
</style>
</head>
<body>
<h1>Aufan's link page: pick a version</h1>
<p>Temporary chooser. The version you pick becomes this address.</p>
<a href="a/">A <small>clean link stack, ice green and coral</small></a>
<a href="b/">B <small>the NFC card itself, near-black and violet</small></a>
<a href="c/">C <small>tear-off flyer, lemon yellow</small></a>
</body>
</html>
